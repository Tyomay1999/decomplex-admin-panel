name: Build and publish Admin Panel Docker image (GHCR)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.repository }}-ghcr-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deps (cache warmup)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          target: deps
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL_PROD }}
            VITE_APP_ENV=prod
            VITE_API_PREFIX=/api
            VITE_DEFAULT_LOCALE=en
          tags: |
            ghcr.io/tyomay1999/decomplex-admin-panel:latest
            ghcr.io/tyomay1999/decomplex-admin-panel:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (demo)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL_DEMO }}
            VITE_APP_ENV=demo
            VITE_API_PREFIX=/api
            VITE_DEFAULT_LOCALE=en
          tags: |
            ghcr.io/tyomay1999/decomplex-admin-panel:demo
          cache-from: type=gha
          cache-to: type=gha,mode=max
